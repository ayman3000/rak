# Builds rak for Linux and macOS when a version tag is pushed, and publishes
# the archives on a GitHub release. The tag must match Cargo.toml's version:
#
#   git tag v0.1.0-alpha.2 && git push origin v0.1.0-alpha.2
#
# Every release is a normal one, marked latest, alphas included, so the
# repository page shows it. Only GitHub's own actions and the gh command are
# used.
name: Release

on:
  push:
    tags: ["v*"]
  # By hand, from the Actions page or `gh workflow run release.yml`: builds
  # and packages everything and publishes nothing. For trying a change to
  # this file without making a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static (musl), so one binary runs on any distribution.
          - { name: linux-x86_64, os: ubuntu-latest, targets: x86_64-unknown-linux-musl }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-musl }
          # Both Mac builds on one runner, one after the other. As two jobs
          # they competed for GitHub's scarce Mac runners: twice (alpha.45,
          # alpha.46) the second waited 15 minutes for one, was cancelled
          # ("not acquired by Runner"), and the release was not published.
          - { name: macos, os: macos-latest, targets: aarch64-apple-darwin x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      # Static Linux builds: Rust brings musl's startup files, and ring's bit of
      # C builds with the runner's own gcc, so no musl package is downloaded
      # (the first release failed when Ubuntu's package servers were unreachable).
      CC_x86_64_unknown_linux_musl: gcc
      CC_aarch64_unknown_linux_musl: gcc
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but Cargo.toml says $version." >&2
            exit 1
          fi
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.targets }}
      - name: Build
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target"
          done
      - name: Package
        shell: bash
        run: |
          # A run by hand has no tag: its archives are named for the version in Cargo.toml.
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" ;;
          esac
          for target in ${{ matrix.targets }}; do
            name="rak-$version-$target"
            mkdir "$name"
            cp "target/$target/release/rak" LICENSE README.md "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
            ls -l "target/$target/release/rak"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: rak-*.tar.gz*

  publish:
    needs: build
    # Only a tag publishes; a run by hand stops after the builds.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "rak $GITHUB_REF_NAME" --generate-notes --latest
