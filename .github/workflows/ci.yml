# Tests on Linux and macOS for every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Lints
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  # Cargo.toml promises Rust 1.88 or newer.
  oldest-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - run: cargo check --all-targets --locked
