<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="rak: the coding agent in a binary under 5 MB">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141c2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <!-- window dots -->
  <circle cx="44" cy="40" r="7" fill="#ff5f57"/>
  <circle cx="68" cy="40" r="7" fill="#febc2e"/>
  <circle cx="92" cy="40" r="7" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <!-- wordmark -->
    <text x="96" y="196" font-size="132" font-weight="700" fill="url(#accent)" letter-spacing="-4">rak</text>
    <text x="100" y="246" font-size="24" fill="#e2e8f0">The coding agent in a binary under 5 MB.</text>
    <text x="100" y="280" font-size="17" fill="#94a3b8">nothing else to install · lean on tokens · asks first</text>
    <text x="100" y="306" font-size="17" fill="#94a3b8">any model, or your ChatGPT plan</text>
    <!-- terminal sketch -->
    <rect x="800" y="78" width="360" height="204" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="822" y="116" font-size="17" fill="#facc15">❯ <tspan fill="#e2e8f0">rak "make the tests pass"</tspan></text>
    <text x="822" y="148" font-size="16" fill="#64748b">→ <tspan fill="#cbd5e1">read_file calc.py</tspan></text>
    <text x="822" y="174" font-size="16" fill="#64748b">→ <tspan fill="#cbd5e1">edit_file calc.py</tspan></text>
    <text x="822" y="200" font-size="16" fill="#f97316">? <tspan fill="#cbd5e1">allow run_shell pytest</tspan></text>
    <text x="822" y="226" font-size="16" fill="#28c840">✓ <tspan fill="#cbd5e1">exit 0, 3 passed</tspan></text>
    <text x="822" y="258" font-size="16" fill="#94a3b8">8 turns · 12K tokens in</text>
  </g>
</svg>
