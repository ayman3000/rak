[package]
name = "rak"
version = "0.1.0-alpha.20"
edition = "2021"
license = "MIT"
description = "Rust Agent Kit: a small coding agent for the terminal, for Linux and macOS."
rust-version = "1.88"

[lib]
name = "rak"
path = "src/lib.rs"

[[bin]]
name = "rak"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# The same TLS stack ureq uses, to trust the system's certificates as well as
# the built-in ones (src/http.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
