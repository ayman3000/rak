[package]
name = "rak"
version = "0.1.0-alpha.46"
edition = "2021"
license = "MIT"
description = "Rust Agent Kit: a small coding agent for the terminal, for Linux and macOS."
rust-version = "1.88"

[lib]
name = "rak"
path = "src/lib.rs"

[[bin]]
name = "rak"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# The same TLS stack ureq uses, to trust the system's certificates as well as
# the built-in ones (src/http.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
# Already built for rustls: SHA-256, random bytes and signature checks for
# Sign in with ChatGPT (src/chatgpt/auth.rs).
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# Optimised for size, not speed: about 17% smaller (4.03 MB to 3.36 MB on an
# Apple Silicon Mac) with no slowdown measured on the file tools or at
# start-up. "z" was 33% smaller and is left alone: it gives up more inlining
# for no need. panic = "abort" would save more and is not used: rak relies on
# unwinding to put the terminal back and to stop the programs it started.
opt-level = "s"
lto = true
strip = true
codegen-units = 1
